name: Master template submission and browser QA
on:
  push:
    paths:
      - '.github/workflows/master-qa.yml'
      - '.github/submission-contract-qa.cjs'
      - 'templates/wayfinder-master.html'
  pull_request:
    paths:
      - '.github/workflows/master-qa.yml'
      - '.github/submission-contract-qa.cjs'
      - 'templates/wayfinder-master.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium Playwright
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Hard-fail on submission contract regression
        run: node .github/submission-contract-qa.cjs --master-only

name: Mandatory Wayfinder submission contract QA
on:
  push:
    paths:
      - 'scripts/*identity*'
      - 'scripts/*content-contract*'
      - 'scripts/*curriculum-quality*'
      - 'scripts/*runtime-scope*'
      - 'scripts/*m1b*'
      - 'scripts/*m1c*'
      - 'scripts/wayfinder-presentation.cjs'
      - 'scripts/wayfinder-record-renderer.cjs'
      - 'scripts/wayfinder_lesson.py'
      - 'scripts/schema/**'
      - 'scripts/fixtures/**'
      - 'scripts/tech-u5-*-source.json'
      - 'scripts/build-*.py'
      - 'scripts/wayfinder-outline-builder.js'
      - 'Tech/**/*.html'
      - 'CS/**/*.html'
      - 'AAVTC/**/*.html'
      - 'templates/wayfinder-master.html'
      - '.github/submission-contract-qa.cjs'
      - '.github/guide-identity-qa.cjs'
      - '.github/tech-prototype-*'
      - '.github/cs-part2-qa.cjs'
      - '.github/wayfinder-qa.cjs'
      - '.github/master-qa-smoke.cjs'
      - 'scripts/check-wayfinder.mjs'
      - 'scripts/wayfinder-preflight.mjs'
      - 'scripts/wayfinder-preflight.md'
      - '.github/workflows/wayfinder-qa.yml'
  pull_request:
    paths:
      - 'scripts/*identity*'
      - 'scripts/*content-contract*'
      - 'scripts/*curriculum-quality*'
      - 'scripts/*runtime-scope*'
      - 'scripts/*m1b*'
      - 'scripts/*m1c*'
      - 'scripts/wayfinder-presentation.cjs'
      - 'scripts/wayfinder-record-renderer.cjs'
      - 'scripts/wayfinder_lesson.py'
      - 'scripts/schema/**'
      - 'scripts/fixtures/**'
      - 'scripts/tech-u5-*-source.json'
      - 'scripts/build-*.py'
      - 'scripts/wayfinder-outline-builder.js'
      - 'Tech/**/*.html'
      - 'CS/**/*.html'
      - 'AAVTC/**/*.html'
      - 'templates/wayfinder-master.html'
      - '.github/submission-contract-qa.cjs'
      - '.github/guide-identity-qa.cjs'
      - '.github/tech-prototype-*'
      - '.github/cs-part2-qa.cjs'
      - '.github/wayfinder-qa.cjs'
      - '.github/master-qa-smoke.cjs'
      - 'scripts/check-wayfinder.mjs'
      - 'scripts/wayfinder-preflight.mjs'
      - 'scripts/wayfinder-preflight.md'
      - '.github/workflows/wayfinder-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-html-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native builder parser for isolated integration tests
        run: python -m pip install beautifulsoup4==4.15.0
      - name: Prove production builders block invalid identities before HTML
        run: node scripts/test-wayfinder-identity.cjs
      - name: Reuse proven runtime checks for curriculum-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          node - <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process');
          let runtime=true;const base=process.env.BASE_SHA;
          if(base&& !/^0+$/.test(base))try{
            const names=cp.execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n');
            runtime=names.some(p=>/^(?:templates\/|assets\/shared\/|(?:Tech|CS|AAVTC)\/.*\.html$|scripts\/wayfinder-(?:record-renderer|presentation)|\.github\/(?:submission-contract-qa|guide-identity-qa|.*browser|tech-prototype|cs-part2-qa|wayfinder-qa|master-qa))/.test(p));
          }catch{runtime=true;}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'runtime='+runtime+'\n');
          JS
  tech-prototype-evidence:
    needs: [pre-html-identity, lesson-content-contract, curriculum-quality]
    if: needs['pre-html-identity'].outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical browser-test dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1 @turbowarp/packager@3.14.0
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify Prototype with the canonical submission runner
        env:
          WF_QA_EVIDENCE_DIR: qa-artifacts/tech-prototype
        run: node .github/submission-contract-qa.cjs Tech/3050201.html Tech/3050202.html Tech/3050203.html Tech/3050204.html Tech/3050205.html Tech/3050206.html Tech/3050207.html
      - name: Execute the displayed block recipes in TurboWarp
        if: always()
        run: node .github/tech-prototype-code-qa.cjs
      - name: Preserve offline browser, clipboard and viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-prototype-browser-evidence
          path: qa-artifacts/tech-prototype*
  submission-contract:
    needs: [pre-html-identity, lesson-content-contract, curriculum-quality]
    if: needs['pre-html-identity'].outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium QA dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify master, CS reference, and all 40 upcoming guides
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/submission-contract-qa.cjs --changed --all-upcoming
      - name: Verify complete CS Part 2 offline modes and desktop/mobile controls
        run: node .github/cs-part2-qa.cjs
      - name: Preserve CS Part 2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-part2-browser-evidence
          path: qa-artifacts/cs-part2

  identity-reconciliation-offline:
    needs: [pre-html-identity, lesson-content-contract, curriculum-quality]
    if: needs['pre-html-identity'].outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser QA dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify the 21 F3 guides function without network resources
        run: node scripts/check-wayfinder-identity-offline.cjs
      - name: Preserve F3 offline and viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3-identity-offline
          path: qa-artifacts/f3-identity

  lesson-content-contract:
    needs: pre-html-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify M1 source extraction, modes, schema and failed-write preservation
        run: node scripts/test-wayfinder-content-contract.cjs
      - name: Verify real frozen single-response question via isolated production entry
        run: node scripts/test-m1b-3050201.cjs

  m1b-isolated-browser:
    needs: [pre-html-identity, lesson-content-contract, curriculum-quality]
    if: needs['pre-html-identity'].outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing browser QA dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Build isolated pilot and compare original and generated offline behavior
        env:
          M1B_PILOT_DIR: /tmp/m1b-isolated
        run: |
          node scripts/test-m1b-3050201.cjs
          node scripts/check-m1b-browser.cjs
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1b-isolated-browser
          path: qa-artifacts/m1b

  m1c-production-fidelity:
    needs: [pre-html-identity, lesson-content-contract, curriculum-quality]
    if: needs['pre-html-identity'].outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing browser QA dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Build one isolated production pilot and test fidelity and offline controls
        env:
          M1C_PILOT_DIR: /tmp/m1c-isolated
        run: |
          node scripts/test-m1c-3050201.cjs
          cp /tmp/m1c-isolated/static-results.json qa-artifacts-m1c-static.json
          node scripts/check-m1c-browser.cjs
      - name: Preserve isolated original and pilot comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1c-production-fidelity
          path: |
            qa-artifacts/m1c
            qa-artifacts-m1c-static.json

  curriculum-quality:
    needs: [pre-html-identity, lesson-content-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unreviewed or mismatched curriculum before HTML
        env:
          M2_RESULTS_PATH: qa-artifacts/m2/results.json
        run: |
          mkdir -p qa-artifacts/m2
          node scripts/test-wayfinder-curriculum-quality.cjs
      - name: Preserve curriculum gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-curriculum-quality
          path: qa-artifacts/m2

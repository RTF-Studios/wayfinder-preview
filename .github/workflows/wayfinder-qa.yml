name: Mandatory Wayfinder submission contract QA
on:
  push:
    paths:
      - 'Tech/**/*.html'
      - 'CS/**/*.html'
      - 'AAVTC/**/*.html'
      - 'templates/wayfinder-master.html'
      - '.github/submission-contract-qa.cjs'
      - '.github/tech-prototype-*'
      - '.github/cs-part2-qa.cjs'
      - '.github/wayfinder-qa.cjs'
      - '.github/master-qa-smoke.cjs'
      - 'scripts/check-wayfinder.mjs'
      - 'scripts/wayfinder-preflight.mjs'
      - 'scripts/wayfinder-preflight.md'
      - '.github/workflows/wayfinder-qa.yml'
  pull_request:
    paths:
      - 'Tech/**/*.html'
      - 'CS/**/*.html'
      - 'AAVTC/**/*.html'
      - 'templates/wayfinder-master.html'
      - '.github/submission-contract-qa.cjs'
      - '.github/tech-prototype-*'
      - '.github/cs-part2-qa.cjs'
      - '.github/wayfinder-qa.cjs'
      - '.github/master-qa-smoke.cjs'
      - 'scripts/check-wayfinder.mjs'
      - 'scripts/wayfinder-preflight.mjs'
      - 'scripts/wayfinder-preflight.md'
      - '.github/workflows/wayfinder-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tech-prototype-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical browser-test dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1 @turbowarp/packager@3.14.0
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify Prototype with the canonical submission runner
        env:
          WF_QA_EVIDENCE_DIR: qa-artifacts/tech-prototype
        run: node .github/submission-contract-qa.cjs Tech/3050201.html Tech/3050202.html Tech/3050203.html Tech/3050204.html Tech/3050205.html Tech/3050206.html Tech/3050207.html
      - name: Execute the displayed block recipes in TurboWarp
        if: always()
        run: node .github/tech-prototype-code-qa.cjs
      - name: Preserve offline browser, clipboard and viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-prototype-browser-evidence
          path: qa-artifacts/tech-prototype*
  submission-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium QA dependency
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify master, CS reference, and all 40 upcoming guides
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/submission-contract-qa.cjs --changed --all-upcoming
      - name: Verify complete CS Part 2 offline modes and desktop/mobile controls
        run: node .github/cs-part2-qa.cjs
      - name: Preserve CS Part 2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-part2-browser-evidence
          path: qa-artifacts/cs-part2

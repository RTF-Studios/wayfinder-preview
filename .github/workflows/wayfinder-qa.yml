name: Wayfinder temporary classroom QA
on:
  push:
    paths:
      - '.github/workflows/wayfinder-qa.yml'
      - '.github/wayfinder-qa.cjs'
      - 'Tech/30401*.html'
      - 'AAVTC/10401*.html'
      - 'CS/20902*.html'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          mkdir -p .github/qa-run
          npm install --prefix .github/qa-run --no-save playwright@1.56.1
          .github/qa-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Test canonical guides in desktop and mobile browsers
        id: test
        continue-on-error: true
        run: node .github/wayfinder-qa.cjs
      - name: Commit sanitized QA results
        if: always()
        env:
          GH_RUN_ID: ${{ github.run_id }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          mkdir -p .github/qa-screenshots
          if [ ! -f .github/qa-screenshots/qa-results.json ]; then
            printf '{"status":"NO_TEST_RESULT","reason":"Test setup or browser execution failed","run_id":"%s","test_outcome":"%s"}\n' "$GH_RUN_ID" "$TEST_OUTCOME" > .github/qa-screenshots/qa-results.json
          fi
          cp .github/qa-screenshots/qa-results.json .github/wayfinder-qa-last-run.json
          git config user.name 'Wayfinder QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/wayfinder-qa-last-run.json
          git commit -m "Record sanitized Wayfinder browser QA outcome" || true
          git push
      - name: Preserve QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfinder-qa-results
          path: .github/qa-screenshots/
          retention-days: 7
